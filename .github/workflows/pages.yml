# Stand Up Founders (standupfounders.com). This repository holds only:
#   site/                          the placeholder-only public build
#   .github/workflows/pages.yml    this file
#   .github/dependabot.yml         a weekly notice of new action releases
#   .gitignore                     keeps keys, real data, recordings and video out
# It publishes site/ (and only site/) to GitHub Pages. Runs on every push to main, or by hand.
# The export guard runs on the build machine before every push (it is not stored here).
name: Deploy Stand Up preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (the release tags are in the comments).
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (= v4)
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v5.0.0 (= v5)
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1 (= v3)
        with:
          path: site
      # The deploy step sometimes failed within a second of the upload ("No artifacts named github-pages found"):
      # the uploaded artifact was not visible yet. Wait a little first, and if the first try still fails, wait and try once more.
      - name: Give GitHub a moment to register the uploaded artifact
        run: sleep 15
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5 (= v4)
      - name: First deploy attempt failed; waiting before the retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5 (= v4)
